<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lockup tour — scroll</title>
    <style>
      html, body { margin: 0; background: #F3E6C8; color: #16120E; font-family: Georgia, serif; }
      .intro { min-height: 70vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 8vh 8vw 6vh; }
      .intro h1 { font-size: clamp(2rem, 6vw, 4.5rem); letter-spacing: -0.03em; margin: 0 0 0.4em; }
      .intro p { max-width: 36rem; line-height: 1.45; opacity: 0.72; }
      .story { height: 320vh; position: relative; }
      #player { position: sticky; top: 0; height: 100vh; width: 100%; background: #F3E6C8; }
      .end { min-height: 50vh; padding: 10vh 8vw; opacity: 0.6; }
    </style>
  </head>
  <body>
    <section class="intro">
      <h1>Same mark.<br>Nine comics.</h1>
      <p>Scroll to walk the tour. The lockup does not move. Only the paint changes. Frame 0 is the cream rest.</p>
    </section>
    <section class="story">
      <div id="player"></div>
    </section>
    <section class="end">Land on cream. That is the brand.</section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
