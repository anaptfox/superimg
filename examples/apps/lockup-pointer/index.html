<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lockup tour — pointer</title>
    <style>
      html, body { margin: 0; min-height: 100vh; background: #16120E; color: #F3E6C8; font-family: Georgia, serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 6vh 4vw; }
      .stage { width: min(100%, 720px); }
      h1 { font-size: 1.6rem; letter-spacing: -0.03em; margin: 0 0 0.4em; }
      p { opacity: 0.65; margin: 0 0 1.4em; line-height: 1.45; }
      #player { position: relative; width: 100%; aspect-ratio: 1; background: #F3E6C8; touch-action: none; cursor: grab; }
      #player:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <h1>Scrub the comic</h1>
        <p>Move across the mark. Press and drag is 1:1; release springs. Same lockup, many materials.</p>
        <div id="player"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
