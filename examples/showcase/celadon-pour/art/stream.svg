<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 120 400">
  <title>Tea stream — origin at the spout lip, world-vertical; geometry is an edit</title>
  <defs>
    <linearGradient id="stream-paint" x1="-6" y1="0" x2="6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a3810"/>
      <stop offset="0.55" stop-color="#b8622a"/>
      <stop offset="1" stop-color="#e7a55c"/>
    </linearGradient>
  </defs>
  <path id="stream-body" d="M0 0 Z" fill="url(#stream-paint)" opacity="0.95"/>
  <path id="stream-glint" d="M0 0" fill="none" stroke="#ffe2b0" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
