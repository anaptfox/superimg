<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request journey — SuperImg interactive example</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #070b15; color: #e8eefc; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 40px 24px; }
      header { margin-bottom: 24px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0; color: #aebbd8; }
      #player { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #26314b; border-radius: 20px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; }
      button { padding: 12px 20px; border-radius: 10px; border: 1px solid #435474; background: #121b30; color: inherit; font: inherit; cursor: pointer; }
      button[aria-current="step"] { background: #d6e3ff; border-color: #d6e3ff; color: #0b1020; }
      button:focus-visible { outline: 3px solid #86b7ff; outline-offset: 4px; }
      button:disabled { opacity: .45; cursor: wait; }
      #status { min-height: 3em; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Request journey</h1><p>Choose a step to follow a web request from hostname to page.</p></header>
      <div id="player" aria-label="Interactive request diagram"></div>
      <nav id="steps" aria-label="Request steps"></nav>
      <p id="status" role="status" aria-live="polite">Loading the lesson…</p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
