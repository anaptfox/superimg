<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="SuperImg">
  <defs>
    <linearGradient id="si-ll-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b6fe8"/>
      <stop offset="100%" stop-color="#6b5bd4"/>
    </linearGradient>
    <linearGradient id="si-ll-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#7c5cdb"/>
    </linearGradient>
    <linearGradient id="si-ll-front" x1="0%" y1="0%" x2="100%" y2="100%">
